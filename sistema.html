<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header><strong>💇 Salão Bella</strong>
        <nav><span id="ola"></span><button id="sair">Sair</button></nav>
    </header>
    <main>
        <section class="grid">
            <div class="card">
                <h3>Próximo horário</h3>
                <p id="proximo">—</p>
            </div>
            <div class="card">
                <h3>Total de agendamentos</h3>
                <p id="total">0</p>
            </div>
        </section>
        <h2 style="margin-top:24px">Novo agendamento</h2>
        <div class="card">
            <form id="formAg">
                <select id="servico" required></select>
                <input type="date" id="data" required>
                <input type="time" id="hora" required>
                <button class="btn">Agendar</button>
                <p class="erro" id="msg"></p>
            </form>
        </div>
        <h2 style="margin-top:24px">Meus agendamentos</h2>
        <div id="lista" class="grid"></div>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
