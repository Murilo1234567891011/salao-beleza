
name: Verificar integridade do projeto

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar-arquivos:
    name: Verificar arquivos essenciais
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Conferir arquivos obrigatorios
        run: |
          test -f index.html
          test -f login.html
          test -f sistema.html
          test -d css
          test -d js
          echo "Arquivos essenciais encontrados."
